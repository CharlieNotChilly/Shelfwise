[project]
name = "shelfwise-forecaster"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "openpyxl",
    "pyarrow",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
test = ["pytest", "httpx2"]

[tool.setuptools]
py-modules = ["data_prep", "features", "backtest", "train", "service"]
